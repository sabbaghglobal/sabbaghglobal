<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sabbagh Global: sourcing and shipping from China, business trips to the Canton Fair, courses, consulting and advertising with Khaled Sabbagh.">
<title>Sabbagh Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* ألوان الهوية (من البزنس كارد) · Brand colours from the card */
:root{
  --paper:#fbf9f4; --paper-raised:#ffffff; --ink:#1f1b16; --ink-muted:#6b6358;
  --gold:#b08a3e; --gold-deep:#7a5c22; --gold-tint:#efe5d0; --night:#1a1611; --hairline:#d8c8a4;
  --on-night:#fbf9f4; --btn-bg:#1a1611; --btn-ink:#fbf9f4; --err:#9b2c22;
  --display-en:"Cormorant Garamond","Times New Roman",serif;
  --display-ar:"Amiri","Cormorant Garamond",serif;
  --sans-en:"Jost","Helvetica Neue",Arial,sans-serif;
  --sans-ar:"Tajawal","Jost",system-ui,sans-serif;
  --cjk:"Noto Serif SC","Songti SC",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#15120e; --paper-raised:#1e1a14; --ink:#f3ece0; --ink-muted:#b3a998;
    --gold:#c9a45c; --gold-deep:#dcbd7e; --gold-tint:#2c251a; --night:#0d0b08; --hairline:#4a3f2c;
    --btn-bg:#c9a45c; --btn-ink:#15120e; --err:#f08a7e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#15120e; --paper-raised:#1e1a14; --ink:#f3ece0; --ink-muted:#b3a998;
  --gold:#c9a45c; --gold-deep:#dcbd7e; --gold-tint:#2c251a; --night:#0d0b08; --hairline:#4a3f2c;
  --btn-bg:#c9a45c; --btn-ink:#15120e; --err:#f08a7e;
}
*{box-sizing:border-box}
html{background:var(--paper)}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);margin:0;font-size:17px;line-height:1.7}
#site{font-family:var(--sans-ar);min-height:100vh;display:flex;flex-direction:column}
#site[data-lang="en"]{font-family:var(--sans-en)}
#site[data-lang="ar"] [data-l="en"],#site[data-lang="en"] [data-l="ar"]{display:none!important}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px;width:100%}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;line-height:1.3}
#site[data-lang="ar"] h1{font-family:var(--display-ar)}
#site[data-lang="en"] h1{font-family:var(--display-en);font-weight:600}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.caps{font-family:var(--sans-en);text-transform:uppercase;letter-spacing:.24em;font-size:12px;font-weight:500;color:var(--gold-deep)}
.zh{font-family:var(--cjk);letter-spacing:.18em;color:var(--gold-deep)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--hairline)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:52px;height:auto;display:block}
.brand b{font-family:var(--sans-en);text-transform:uppercase;letter-spacing:.22em;font-size:13px;font-weight:600}
.tools{display:flex;align-items:center;gap:6px}
.icon-link{width:38px;height:38px;display:grid;place-items:center;color:var(--gold-deep);text-decoration:none;border:1px solid transparent}
.icon-link:hover{border-color:var(--hairline)}
.icon-link svg{width:20px;height:20px}
.langbtn{font-family:var(--sans-ar);font-size:15px;font-weight:500;background:transparent;border:1px solid var(--hairline);padding:6px 14px;cursor:pointer;margin-inline-start:6px}
.langbtn:hover{border-color:var(--gold)}
@media (max-width:480px){.brand b{display:none}}

main{flex:1}
.page{padding-block:40px 64px}

/* home */
.home-head{text-align:center;display:grid;justify-items:center;gap:10px;margin-bottom:36px}
.home-head img{width:min(260px,70%);height:auto}
.home-head h1{font-size:clamp(32px,5vw,50px);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;text-decoration:none;background:var(--paper-raised);border:1px solid var(--hairline);padding:16px;max-width:100%}
.tile:hover{border-color:var(--gold);background:var(--gold-tint)}
.tile svg{width:52px;height:52px;color:var(--gold-deep)}
.tile span.t{font-size:20px;font-weight:700;line-height:1.3}
.sub{font-size:14px;color:var(--gold-deep);font-weight:500;line-height:1.3;margin-top:-8px}
.svc-hero .sub{font-size:17px;margin-top:-6px}
.tile span.b{font-family:var(--sans-en);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);margin-top:-8px}
@media (max-width:640px){.grid{gap:8px}.tile{gap:8px;padding:8px}.tile svg{width:34px;height:34px}.tile span.t{font-size:14px}.tile .sub{font-size:11px;margin-top:-4px}.sub{font-size:14px;color:var(--gold-deep);font-weight:500;line-height:1.3;margin-top:-8px}
.svc-hero .sub{font-size:17px;margin-top:-6px}
.tile span.b{font-size:9px;letter-spacing:.08em;margin-top:-4px}}

/* service page */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-muted);font-size:15px;margin-bottom:24px}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;flex:none}
#site[dir="rtl"] .back svg{transform:scaleX(-1)}
.svc{display:grid;grid-template-columns:1fr 1.35fr;gap:44px;align-items:start}
.svc-hero{display:grid;gap:14px;justify-items:start}
.svc-hero .big{width:88px;height:88px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold-deep)}
.svc-hero .big svg{width:50px;height:50px}
.svc-hero h1{font-size:clamp(30px,4.4vw,46px)}
.svc-hero p.one{font-size:19px;color:var(--ink-muted)}
.points{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.points li{border:1px solid var(--hairline);padding:6px 14px;font-size:16px;font-weight:500;background:var(--paper-raised)}
.price{display:flex;align-items:baseline;gap:10px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding-block:10px;width:100%}
.price b{font-family:var(--sans-en);font-size:34px;font-weight:500;color:var(--gold-deep)}
.price span{color:var(--ink-muted)}
.stack{display:grid;gap:18px}
@media (max-width:820px){.svc{grid-template-columns:1fr;gap:28px}.svc-hero{position:static}}

/* forms */
form.card{background:var(--paper-raised);border:1px solid var(--hairline);padding:24px;display:grid;gap:18px}
form.card h2{font-size:21px}
.fld{display:grid;gap:8px}
.fld > .lbl{font-size:16px;font-weight:700}
.fld > .lbl small{font-weight:400;color:var(--ink-muted);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
input[type=text],input[type=tel],input[type=number],input[type=email],input[type=url],textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--hairline);padding:12px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
.unit{display:flex;align-items:stretch}
.unit input{flex:1;min-width:0}
.unit span{display:grid;place-items:center;padding-inline:14px;border:1px solid var(--hairline);border-inline-start:0;background:var(--gold-tint);font-family:var(--sans-en);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{position:relative;display:grid;gap:2px;align-content:center;min-height:56px;border:1px solid var(--hairline);background:var(--paper);padding:10px 12px;cursor:pointer;font-weight:600;line-height:1.35}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt small{font-weight:400;color:var(--ink-muted);font-size:13px}
.opt .en-code{font-family:var(--sans-en);font-size:12px;letter-spacing:.12em;color:var(--gold-deep);font-weight:500}
.opt:hover{border-color:var(--gold)}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-tint);box-shadow:inset 0 0 0 1px var(--gold)}
.opt:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opts.big .opt{min-height:88px;padding:14px}
.opts.big .opt b{font-size:19px}
.drop{border:1px dashed var(--gold);padding:18px;text-align:center;cursor:pointer;display:grid;gap:6px;justify-items:center;color:var(--ink-muted);background:var(--paper)}
.drop:hover{background:var(--gold-tint)}
.drop svg{width:28px;height:28px;color:var(--gold-deep)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border:1px solid var(--hairline)}
.fld.bad input,.fld.bad textarea,.fld.bad .opts{outline:2px solid var(--err);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:18px;background:var(--btn-bg);color:var(--btn-ink);border:0;padding:14px 26px;cursor:pointer;text-decoration:none}
.btn svg{width:22px;height:22px;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--gold)}
.btn:hover{filter:brightness(1.12)}
.status{font-size:15px;padding:12px;background:var(--gold-tint)}
.status.bad{color:var(--err)}
.hint{font-size:14px;color:var(--ink-muted)}

/* calendar */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days .opt{min-width:92px;text-align:center;justify-items:center}
.days .opt b{font-family:var(--sans-en);font-size:24px;font-weight:500}
.slots{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.slots .opt{text-align:center;justify-items:center}
.slots .opt b{font-family:var(--sans-en);font-size:19px;font-weight:500}

/* track */
.track{border:1px solid var(--gold);padding:20px;display:grid;gap:12px;background:var(--paper-raised)}
.track h2{font-size:19px}
.track .line{display:flex;gap:8px}
.track input{flex:1;min-width:0;font-family:var(--sans-en);letter-spacing:.08em;text-transform:uppercase}

/* about */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:48px}
.about h1{font-size:clamp(34px,5vw,52px);margin-top:6px}
.about .bio{display:grid;gap:12px;color:var(--ink-muted);margin-top:14px;max-width:36em}
.contact{display:grid;gap:20px;align-content:start;border-inline-start:1px solid var(--hairline);padding-inline-start:28px}
.contact .val{font-family:var(--sans-en);direction:ltr;unicode-bidi:isolate;user-select:all;font-size:18px}
.contact .en-addr{font-family:var(--sans-en);font-size:15px;color:var(--ink-muted)}
.socials{display:flex;flex-wrap:wrap;gap:10px}
.socials a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hairline);padding:8px 14px;text-decoration:none;font-family:var(--sans-en);font-size:15px}
.socials a:hover{border-color:var(--gold)}
.socials svg{width:18px;height:18px;color:var(--gold-deep)}
@media (max-width:820px){.about{grid-template-columns:1fr;gap:32px}.contact{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--hairline);padding-top:24px}}

/* cover (trip) */
.cover{position:relative;margin-bottom:32px;border:1px solid var(--gold);overflow:hidden;background:#15120e;aspect-ratio:21/7;max-width:100%}
.cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover .cap{position:absolute;inset-inline-start:20px;bottom:16px;color:#fbf9f4;display:grid;gap:2px}
.cover .cap b{font-family:var(--sans-en);letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:#c9a45c}
.cover .cap span{font-size:clamp(18px,2.6vw,26px);font-weight:700}
@media (max-width:640px){.cover{aspect-ratio:16/8}}
/* info blocks */
.info{display:grid;gap:10px;width:100%}
.info h3{font-size:18px;margin-top:8px}
.phase{border:1px solid var(--hairline);background:var(--paper-raised);padding:12px 14px;display:grid;gap:4px}
.phase .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.phase .top b{font-size:17px}
.phase .top span{font-family:var(--sans-en);font-size:13px;color:var(--gold-deep);direction:ltr}
.phase p{font-size:15px;color:var(--ink-muted);line-height:1.6}
.stops{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stops li{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--hairline);padding-bottom:8px;font-weight:500}
.stops li b{font-family:var(--sans-en);color:var(--gold-deep);min-width:26px}
/* rate card */
.rate{width:100%;border:1px solid var(--gold);background:var(--paper-raised)}
.rate .hd{padding:12px 14px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.rate .hd b{font-size:16px}
.rate .hd span{font-size:13px;color:var(--ink-muted)}
.rate .nums{display:grid;grid-template-columns:repeat(3,1fr)}
.rate .n{padding:14px;border-bottom:1px solid var(--hairline);border-inline-end:1px solid var(--hairline);display:grid;gap:2px}
.rate .n:nth-child(3n){border-inline-end:0}
.rate .n b{font-family:var(--sans-en);font-size:24px;font-weight:500;color:var(--gold-deep);direction:ltr;text-align:start}
.rate .n span{font-size:13px;color:var(--ink-muted)}
.rate .fmt{padding:12px 14px;display:grid;gap:6px}
.rate .fmt div{display:flex;justify-content:space-between;gap:8px;font-size:15px;border-bottom:1px dashed var(--hairline);padding-bottom:6px}
.rate .fmt div:last-child{border-bottom:0}
.rate .fmt i{font-style:normal;color:var(--ink-muted);font-size:13px}
@media (max-width:420px){.rate .nums{grid-template-columns:repeat(2,1fr)}.rate .n:nth-child(3n){border-inline-end:1px solid var(--hairline)}.rate .n:nth-child(2n){border-inline-end:0}.rate .n b{font-size:20px}}
/* payments */
.pay{background:var(--paper-raised);border:1px solid var(--hairline);padding:24px;display:grid;gap:14px}
.pay h2{font-size:21px}
.pay .row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pay .qr{border:1px solid var(--hairline);padding:12px;display:grid;gap:8px;justify-items:center;text-align:center;background:#fff;color:#1f1b16}
.pay .qr img{width:100%;max-width:200px;height:auto;display:block}
.pay .qr b{font-size:15px}
.pay .cliq{border:1px solid var(--hairline);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pay .cliq code{font-family:var(--sans-en);font-size:20px;letter-spacing:.06em;user-select:all;direction:ltr}
.copy{font:inherit;font-size:14px;background:transparent;border:1px solid var(--gold);padding:6px 12px;cursor:pointer}
.chipfile{font-size:13px;border:1px solid var(--hairline);padding:4px 8px;font-family:var(--sans-en);direction:ltr}
.track .result{font-size:15px;padding:10px 12px;background:var(--gold-tint);white-space:pre-line}
.thanks{border:1px solid var(--gold);background:var(--gold-tint);padding:32px 24px;display:grid;gap:12px;justify-items:center;text-align:center}
.thanks .ok{width:56px;height:56px;border:1px solid var(--gold);display:grid;place-items:center;font-size:28px;color:var(--gold-deep);background:var(--paper-raised)}
.thanks h2{font-size:22px}
.thanks p{color:var(--ink-muted)}
footer{background:var(--night);color:var(--on-night);padding-block:22px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
footer nav{display:flex;gap:18px}
footer a{text-decoration:none}
footer .dom{font-family:var(--sans-en);letter-spacing:.2em;text-transform:uppercase;color:#c9a45c}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.icon-link,.opt{transition:border-color .15s,background-color .15s,filter .15s}}
</style>
</head>

/* ---------- مواعيد الاستشارة (توقيت الصين UTC+8) ---------- */
function consultDays(){
  const c = CONFIG.consult, out = [];
  const nowCN = new Date(Date.now() + 8*3600e3);           // وقت الصين كـ UTC
  let d = new Date(Date.UTC(nowCN.getUTCFullYear(), nowCN.getUTCMonth(), nowCN.getUTCDate() + 1));
  while (out.length < c.weeksAhead){
    if (d.getUTCDay() === c.day) out.push(new Date(d));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return out;
}
function consultSlots(){
  const c = CONFIG.consult, toMin = s => +s.slice(0,2)*60 + +s.slice(3);
  const out = [];
  for (let m = toMin(c.start); m + c.minutes <= toMin(c.end); m += c.minutes) out.push(m);
  return out;
}
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
function localTime(day, m){
  const t = Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), 0, m) - 8*3600e3;
  return new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t));
}
const monthName = (d, l) => new Intl.DateTimeFormat(l === "ar" ? "ar" : "en", {month:"short", timeZone:"UTC"}).format(d);

function fieldHTML(f, sid){
  if (f.row) return `<div class="row2">${f.row.map(x => fieldHTML(x, sid)).join("")}</div>`;
  const id = `${sid}-${f.id}`;
  const show = f.showIf ? ` data-show="${f.showIf[0]}:${f.showIf[1]}" hidden` : "";
  const opt = !f.req && f.type !== "file" ? "" : "";
  const optional = f.req ? "" : ` <small>${bi(f.rec ? {ar:"(موصى به)",en:"(recommended)"} : {ar:"(اختياري)",en:"(optional)"})}</small>`;
  const lbl = f.l ? `<span class="lbl">${bi(f.l)}${optional}</span>` : "";
  const ph = f.ph ? ` data-ph-ar="${esc(f.ph.ar)}" data-ph-en="${esc(f.ph.en)}"` : "";
  let body = "";
  switch (f.type){
    case "text": case "tel": case "email": case "url":
      body = `<input type="${f.type}" id="${id}" name="${f.id}"${f.ac?` autocomplete="${f.ac}"`:""}${f.type!=="text"?' dir="ltr"':""}${ph}>`;
      return `<label class="fld" data-f="${f.id}" for="${id}"${show}>${lbl}${body}</label>`;
    case "number":
      body = `<span class="unit"><input type="number" min="0" step="any" inputmode="decimal" id="${id}" name="${f.id}" dir="ltr"${ph}><span>${esc(f.unit)}</span></span>`;
      return `<label class="fld" data-f="${f.id}" for="${id}"${show}>${lbl}${body}</label>`;
    case "textarea":
      return `<label class="fld" data-f="${f.id}" for="${id}"${show}>${lbl}<textarea id="${id}" name="${f.id}"${ph}></textarea></label>`;
    case "file":
      return `<div class="fld" data-f="${f.id}"${show}>${lbl}
        <label class="drop" for="${id}">${svg("upload")}<span>${bi(f.drop || {ar:"اضغط لإضافة صور",en:"Tap to add photos"})}</span>
        <input type="file" id="${id}" name="${f.id}" accept="${f.accept||"image/*"}" multiple></label>
        <div class="thumbs"></div></div>`;
    case "choice":
      return `<fieldset class="fld" data-f="${f.id}" style="border:0;padding:0;margin:0"${show}><legend class="lbl" style="padding:0;margin-bottom:8px">${bi(f.l)}${f.multi?` <small>${bi({ar:"(يمكن اختيار أكثر من واحد)",en:"(pick one or more)"})}</small>`:""}</legend>
        <div class="opts${f.big?" big":""}">${f.opts.map((o,i) => `<label class="opt"><input type="${f.multi?"checkbox":"radio"}" name="${sid}-${f.id}" value="${esc(o.v)}" id="${id}-${i}">
          ${o.code?`<span class="en-code">${esc(o.code)}</span>`:""}<b${o.ltr?' dir="ltr"':""}>${bi(o)}</b>${o.sub?`<small>${bi(o.sub)}</small>`:""}</label>`).join("")}</div></fieldset>`;
    case "slots": {
      const c = CONFIG.consult, days = consultDays(), slots = consultSlots();
      return `<div class="fld" data-f="${f.id}">
        <span class="lbl">${bi({ar:"اليوم (السبت)",en:"Day (Saturday)"})}</span>
        <div class="days opts">${days.map((d,i) => `<label class="opt"><input type="radio" name="${sid}-day" value="${d.toISOString().slice(0,10)}" id="${id}-d${i}">
          <small>${bi({ar:"السبت",en:"Sat"})}</small><b>${d.getUTCDate()}</b><small class="mon" data-iso="${d.toISOString()}"></small></label>`).join("")}</div>
        <span class="lbl" style="margin-top:6px">${bi({ar:"الوقت (توقيت الصين)",en:"Time (China time)"})}</span>
        <div class="slots opts">${slots.map((m,i) => `<label class="opt"><input type="radio" name="${sid}-time" value="${hhmm(m)}" id="${id}-t${i}">
          <b>${hhmm(m)}</b><small class="loc" data-m="${m}"></small></label>`).join("")}</div>
        <p class="hint">${bi({ar:`كل جلسة ${c.minutes} دقيقة. الوقت الصغير تحت كل موعد هو وقته عندك.`,en:`Each session is ${c.minutes} minutes. The small time under each slot is your local time.`})}</p>
      </div>`;
    }
  }
  return "";
}

        <p>${bi({ar:"درس في جامعة ستانفورد والجامعة الهاشمية وجامعة جينان، ويعمل بين مكتبيه في عمّان وقوانغتشو.",en:"He studied at Stanford University, The Hashemite University and Jinan University, and works between his offices in Amman and Guangzhou."})}</p>
      </div>
    </div>
    <div class="contact">
      <div>
        <p class="zh" lang="zh" style="font-size:16px;letter-spacing:.1em">萨巴格国际贸易物流有限公司</p>
        <p class="caps" style="color:var(--ink);font-size:11px;letter-spacing:.18em">Sabbagh International Trading &amp; Logistics</p>
      </div>
      <p class="val">${esc(CONFIG.phoneShown)}</p>
      <div>
        <p class="zh" lang="zh" style="letter-spacing:.04em;font-size:15px">广州市天河区天河北路233号6801</p>
        <p class="en-addr">Room 6801, No. 233 Tianhe North Road, Tianhe District, Guangzhou</p>
      </div>
      <div class="socials">
        <a id="a-ig" href="#about">${svg("ig")}Instagram</a>
        <a id="a-li" href="#about">${svg("li")}LinkedIn</a>
      </div>

  </div>
</div></section>`;

$("#pages").innerHTML = homePage + SERVICES.map(svcPage).join("") + aboutPage;

/* روابط السوشال */
$("#h-ig").innerHTML = svg("ig"); $("#h-li").innerHTML = svg("li");
[["h-ig","instagram"],["h-li","linkedin"],["a-ig","instagram"],["a-li","linkedin"]].forEach(([id,k]) => {
  const el = document.getElementById(id);
  if (CONFIG[k]){ el.href = CONFIG[k]; el.target = "_blank"; el.rel = "noopener"; }
});

/* إظهار الحقول حسب الاختيار */
document.addEventListener("change", e => {
  const form = e.target.closest("form[data-svc]");
  if (form){
    form.querySelectorAll("[data-show]").forEach(el => {
      const [fid, val] = el.dataset.show.split(":");
      const picked = form.querySelector(`input[name="${form.dataset.svc}-${fid}"]:checked`);
      el.hidden = !(picked && picked.value === val);
    });
    e.target.closest(".fld")?.classList.remove("bad");
  }
  if (e.target.type === "file"){
    const box = e.target.closest(".fld").querySelector(".thumbs");
    box.innerHTML = "";
    [...e.target.files].slice(0, 12).forEach(file => {
      if (file.type.startsWith("image/")){
        const img = document.createElement("img");
        img.alt = file.name; img.src = URL.createObjectURL(file); box.appendChild(img);
      } else {
        const t = document.createElement("span"); t.className = "chipfile"; t.textContent = file.name; box.appendChild(t);
      }
    });
  }
});

/* التنقل */
function route(){
  const id = (location.hash || "#home").slice(1);
  const pages = document.querySelectorAll("[data-page]");
  const ok = [...pages].some(p => p.dataset.page === id);
  pages.forEach(p => p.hidden = p.dataset.page !== (ok ? id : "home"));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* اللغة */
function setLang(l){
  site.dataset.lang = l; site.dir = l === "ar" ? "rtl" : "ltr"; site.lang = l;
  document.documentElement.lang = l;
  $("#langbtn").textContent = l === "ar" ? "English" : "العربية";
  document.querySelectorAll("[data-ph-ar]").forEach(el => el.placeholder = el.dataset["ph" + (l === "ar" ? "Ar" : "En")]);
  document.querySelectorAll(".mon").forEach(el => el.textContent = monthName(new Date(el.dataset.iso), l));
  try { localStorage.setItem("sg-lang", l); } catch(e) {}
}
/* وقت كل موعد بتوقيت الزائر (حسب أول سبت مختار) */
function updateLocalTimes(){
  const form = document.querySelector('form[data-svc="consult"]');
  const dayIn = form.querySelector('input[name="consult-day"]:checked');
  const day = dayIn ? new Date(dayIn.value + "T00:00:00Z") : consultDays()[0];
  const you = site.dataset.lang === "ar" ? "عندك " : "you: ";
  form.querySelectorAll(".loc").forEach(el => el.textContent = you + localTime(day, +el.dataset.m));
}
let saved = null;
try { saved = localStorage.getItem("sg-lang"); } catch(e) {}
setLang(saved === "en" ? "en" : "ar");
updateLocalTimes();
$("#langbtn").addEventListener("click", () => { setLang(lang() === "ar" ? "en" : "ar"); updateLocalTimes(); });
document.addEventListener("change", e => { if (e.target.name === "consult-day") updateLocalTimes(); });
route();

/* ---------- فتح واتساب ---------- */
function openWA(text){
  const a = document.createElement("a");
  a.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text);
  a.target = "_blank"; a.rel = "noopener"; a.click();
}

/* ---------- شكراً بعد الإرسال ---------- */
function showThanks(form, line){
  form.hidden = true;
  const box = document.createElement("div");
  box.className = "thanks";
  box.innerHTML = `<span class="ok" aria-hidden="true">✓</span>
    <h2>${bi({ar:"شكراً لك، تم إرسال طلبك",en:"Thank you, your request has been sent"})}</h2>
    <p>${bi(line)}</p>
    <button class="btn ghost" type="button">${bi({ar:"إرسال طلب آخر",en:"Send another request"})}</button>`;
  box.querySelector("button").onclick = () => { box.remove(); form.hidden = false; };
  form.after(box);
  box.scrollIntoView({block:"center"});
}

/* ---------- الإرسال ---------- */
const toB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = no; r.readAsDataURL(f); });
const MAX_FILE = 10 * 1024 * 1024;   // ponytail: 10MB per file, Apps Script caps a request at ~50MB

async function postSheet(body){
  const r = await fetch(CONFIG.sheetUrl, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "failed");
  return j;
}

$("#track-btn").addEventListener("click", async () => {
  const code = $("#track-code").value.trim().toUpperCase(), ar = lang() === "ar", out = $("#track-result");
  if (!code){ $("#track-code").focus(); return; }
  if (!CONFIG.sheetUrl){ openWA((ar ? "أريد تتبّع شحنتي. الكود: " : "Please track my shipment. Code: ") + code); return; }
  out.hidden = false; out.textContent = ar ? "جارٍ البحث..." : "Searching...";
  try {
    const j = await (await fetch(CONFIG.sheetUrl + "?track=" + encodeURIComponent(code))).json();
    out.textContent = j.found
      ? (ar ? `الحالة: ${j.status}\nالموقع: ${j.location || "-"}\nالوصول المتوقع: ${j.eta || "-"}` : `Status: ${j.status}\nLocation: ${j.location || "-"}\nETA: ${j.eta || "-"}`)
      : (ar ? "ما لقينا هذا الكود. تأكد منه أو راسلنا." : "We couldn't find this code. Check it or contact us.");
  } catch (err) { out.textContent = ar ? "تعذّر البحث الآن. حاول لاحقاً." : "Search failed. Try again later."; }
});

document.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = lang() === "ar" ? "تم النسخ" : "Copied"; }).catch(() => {});
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-svc]"); if (!form) return;
  e.preventDefault();
  const s = SERVICES.find(x => x.id === form.dataset.svc), l = lang(), ar = l === "ar";
  const st = form.querySelector(".status"), btn = form.querySelector("button[type=submit]");
  const lines = [(s.brand ? s.brand + " · " : "") + s.t[l]];
  const data = {}, files = [], missing = [];
  let slot = null, tooBig = false;
  form.querySelectorAll(".fld").forEach(x => x.classList.remove("bad"));

  for (const f of flat(s.fields)){
    const wrap = form.querySelector(`[data-f="${f.id}"]`);
    if (!wrap || wrap.hidden) continue;
    let val = "", valEn = "";
    if (f.type === "choice"){
      const picked = [...form.querySelectorAll(`input[name="${s.id}-${f.id}"]:checked`)].map(c => f.opts.find(o => o.v === c.value));
      val = picked.map(o => o[l]).join("، "); valEn = picked.map(o => o.en).join(", ");
    } else if (f.type === "slots"){
      const d = form.querySelector(`input[name="${s.id}-day"]:checked`), t = form.querySelector(`input[name="${s.id}-time"]:checked`);
      if (d && t){ slot = {date:d.value, time:t.value}; val = valEn = `${d.value} ${t.value} (China time)`; }
      if (!val) missing.push(wrap);
      lines.push((ar ? "الموعد: " : "Slot: ") + (val || "-"));
      if (val) data["Slot (China time)"] = `${d.value} ${t.value}`;
      continue;
    } else if (f.type === "file"){
      const list = [...wrap.querySelector("input").files];
      for (const file of list){
        if (file.size > MAX_FILE){ tooBig = true; continue; }
        files.push({field:f.l.en, name:file.name, type:file.type, data:null, file});
      }
      if (list.length) val = valEn = `${list.length} file(s)`;
    } else {
      val = valEn = wrap.querySelector("input,textarea").value.trim();
      if (val && f.unit){ val += " " + f.unit; valEn = val; }
    }
    if (f.req && !val) missing.push(wrap);
    if (val){ lines.push(f.l[l] + ": " + val); if (f.type !== "file") data[f.l.en] = valEn; }
  }

  st.hidden = false;
  const emailIn = form.querySelector("input[type=email]");
  if (emailIn && emailIn.value && !emailIn.checkValidity()) missing.push(emailIn.closest(".fld"));
  if (missing.length || tooBig){
    missing.forEach(w => w.classList.add("bad"));
    st.classList.add("bad");
    st.textContent = tooBig ? (ar ? "حجم الملف أكبر من 10MB. صغّره أو أرسله على واتساب." : "A file is over 10MB. Make it smaller or send it on WhatsApp.")
                            : (ar ? "أكمل الخانات المعلّمة باللون الأحمر." : "Fill in the boxes marked in red.");
    missing[0]?.querySelector("input,textarea")?.focus();
    return;
  }
  st.classList.remove("bad");

  /* بدون Google Sheet: واتساب */
  if (!CONFIG.sheetUrl){
    if (files.length) lines.push(ar ? `(مرفقات: ${files.length}، سأرسلها في المحادثة)` : `(${files.length} attachment(s), I'll send them in this chat)`);
    openWA(lines.join("\n"));
    st.textContent = ar ? "فتحنا واتساب برسالتك. اضغط إرسال." : "WhatsApp is open with your message. Tap send.";
    return;
  }

  /* مع Google Sheet */
  btn.disabled = true;
  st.textContent = ar ? "جارٍ الإرسال..." : "Sending...";
  try {
    for (const x of files){ x.data = await toB64(x.file); delete x.file; }
    await postSheet({
      funnel: s.id, service: (s.brand ? s.brand + " · " : "") + s.t.en, lang: l,
      name: data["Name"] || "", email: data["Your email"] || "", whatsapp: data["WhatsApp number"] || "",
      slot, data, files
    });
    form.reset(); form.querySelectorAll(".thumbs").forEach(t => t.innerHTML = "");
    form.querySelectorAll("[data-show]").forEach(el => el.hidden = true);
    const em = data["Your email"];
    st.hidden = true;
    showThanks(form, s.id === "consult"
      ? {ar:"سنؤكد الموعد خلال 6 ساعات عبر الإيميل: " + em, en:"We will confirm the time within 6 hours by email: " + em}
      : {ar:"أرسلنا لك إيميل تأكيد على " + em + "، وسنتواصل معك قريباً.", en:"We sent a confirmation to " + em + " and will contact you soon."});
  } catch (err) {
    st.classList.add("bad");
    st.textContent = (ar ? "ما قدرنا نرسل الطلب. راسلنا على " : "We couldn't send the request. Email us at ") + CONFIG.email;
  } finally { btn.disabled = false; }
});
</script>
